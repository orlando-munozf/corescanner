<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner CORE — Diagnóstico de Comunicación e Influencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0A0908;
    --bg-soft: #131110;
    --bg-card: #1A1713;
    --text: #F5F1E8;
    --text-muted: #8B837A;
    --text-dim: #5C554C;
    --border: #2A2620;
    --border-strong: #3D372D;
    --gold: #F5C518;
    --gold-bright: #FFD84D;
    --gold-deep: #C99A0A;
    --gold-glow: rgba(245, 197, 24, 0.15);
    --red-soft: #C4553D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(ellipse at 50% 0%, var(--gold-glow) 0%, transparent 55%),
      radial-gradient(circle at 15% 90%, rgba(245, 197, 24, 0.04) 0%, transparent 40%);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  .brand span { color: var(--gold); }
  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* INTRO */
  .intro h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(38px, 7vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }
  .intro h1 em {
    font-style: italic;
    font-weight: 300;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .intro .lede {
    font-size: 17px;
    color: var(--text-muted);
    max-width: 560px;
    margin-bottom: 40px;
    line-height: 1.6;
  }
  .intro .lede strong { color: var(--text); font-weight: 500; }

  .pillars-preview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 40px;
  }
  .pillar-item { background: var(--bg-soft); padding: 20px 18px; position: relative; }
  .pillar-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: var(--gold);
    opacity: 0.6;
  }
  .pillar-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }
  .pillar-name {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .pillar-desc { font-size: 12px; color: var(--text-dim); line-height: 1.4; }

  .start-btn {
    background: var(--gold);
    color: var(--bg);
    border: none;
    padding: 18px 32px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .start-btn:hover {
    transform: translateX(2px);
    box-shadow: 0 0 30px 0 var(--gold-glow);
    background: var(--gold-bright);
  }
  .start-btn .arrow { transition: transform 0.2s ease; }
  .start-btn:hover .arrow { transform: translateX(4px); }

  .intro-meta {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 32px;
    font-size: 13px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .intro-meta strong { color: var(--gold); font-weight: 600; }

  /* PROGRESS */
  .progress-wrap { margin-bottom: 48px; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .pillar-badge { color: var(--gold); }
  .progress-bar { height: 1px; background: var(--border); position: relative; overflow: hidden; }
  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-bright));
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* OPEN QUESTION */
  .open-block { max-width: 620px; }
  .open-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .open-question {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(26px, 4vw, 34px);
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .open-hint { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }
  .open-input {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 20px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.6;
    resize: vertical;
    min-height: 140px;
    transition: border-color 0.2s ease;
  }
  .open-input:focus { outline: none; border-color: var(--gold); }
  .open-input::placeholder { color: var(--text-dim); }

  /* BINARY BLOCK */
  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.08em;
    margin-bottom: 20px;
  }
  .q-text {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(24px, 3.8vw, 32px);
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    max-width: 620px;
  }
  .q-context {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 40px;
    max-width: 560px;
    line-height: 1.55;
  }
  .q-layer-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 4px 10px;
    margin-bottom: 24px;
  }

  .binary-options { display: flex; gap: 12px; }
  .binary-btn {
    flex: 1;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 28px 24px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }
  .binary-btn:hover {
    border-color: var(--gold);
    background: var(--bg-card);
    transform: translateY(-2px);
  }
  .binary-btn .sub {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .binary-btn.selected {
    border-color: var(--gold);
    background: var(--gold-glow);
    color: var(--gold);
  }

  /* LAYER 2 PROGRESSIVE DISCLOSURE */
  .layer2-block {
    margin-top: 32px;
    padding-top: 4px;
  }
  .layer2-connector {
    width: 1px;
    height: 28px;
    background: linear-gradient(180deg, var(--gold), transparent);
    margin: 0 auto 20px;
  }
  .layer2-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin-bottom: 20px;
  }
  .q-subtext {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(21px, 3.2vw, 27px);
    line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    max-width: 620px;
  }

  .nav-row {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .back-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 0;
    transition: color 0.2s ease;
  }
  .back-btn:hover { color: var(--gold); }
  .back-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .continue-btn {
    background: var(--gold);
    color: var(--bg);
    border: none;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .continue-btn:hover { background: var(--gold-bright); transform: translateX(2px); }

  /* SECTION INTRO */
  .section-intro { max-width: 600px; padding: 40px 0; }
  .section-intro .sec-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 20px;
  }
  .section-intro h2 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(32px, 5vw, 44px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
  }
  .section-intro h2 em {
    font-style: italic;
    color: var(--gold);
    font-weight: 300;
  }
  .section-intro p { font-size: 16px; color: var(--text-muted); line-height: 1.65; }

  /* RESULTS */
  .results-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .results-title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(32px, 5vw, 48px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .results-title em {
    font-style: italic;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 300;
  }
  .results-intro-text {
    font-size: 16px;
    color: var(--text-muted);
    line-height: 1.65;
    margin-bottom: 48px;
    max-width: 580px;
  }

  .pillar-result {
    border: 1px solid var(--border);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .pillar-result-head {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border);
  }
  .pillar-result-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .pillar-result-name {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .pillar-result-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--gold);
  }
  .gap-track {
    height: 8px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }
  .gap-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold));
    transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .pillar-result-body { padding: 20px 28px 24px; }
  .pillar-verdict {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 20px;
  }
  .gap-items { display: flex; flex-direction: column; gap: 10px; }
  .gap-line {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .gap-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 8px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .gap-status.solid { background: var(--gold-glow); color: var(--gold); }
  .gap-status.partial { background: rgba(196, 85, 61, 0.15); color: var(--red-soft); }
  .gap-status.missing { background: rgba(140, 131, 122, 0.12); color: var(--text-muted); }
  .gap-label { color: var(--text-muted); }

  /* IMPACT */
  .impact-block {
    border: 1px solid var(--gold-deep);
    background: linear-gradient(135deg, var(--bg-soft), var(--bg-card));
    padding: 32px;
    margin: 40px 0;
    position: relative;
    overflow: hidden;
  }
  .impact-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .impact-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .impact-headline {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 20px;
  }
  .impact-text { font-size: 15px; color: var(--text-muted); line-height: 1.65; }

  /* CTA */
  .cta-block {
    text-align: center;
    padding: 48px 32px;
    border: 1px solid var(--border);
    margin-top: 40px;
    background: var(--bg-soft);
  }
  .cta-headline {
    font-family: 'Fraunces', serif;
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .cta-headline em { font-style: italic; color: var(--gold); }
  .cta-sub {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }
  .cta-buttons { display: flex; flex-direction: column; gap: 12px; max-width: 380px; margin: 0 auto; }
  .cta-btn {
    padding: 18px 28px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.2s ease;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
  }
  .cta-btn.pdf {
    background: var(--gold);
    color: var(--bg);
  }
  .cta-btn.pdf:hover { background: var(--gold-bright); box-shadow: 0 0 24px var(--gold-glow); }
  .cta-btn.pdf.done { background: var(--bg-card); color: var(--gold); border: 1px solid var(--gold); }
  .cta-btn.wa {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .cta-btn.wa:hover { border-color: var(--gold); color: var(--gold); }
  .cta-btn.wa.highlight {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--gold-glow); }
    50% { box-shadow: 0 0 24px 2px var(--gold-glow); }
  }
  .cta-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 20px;
    letter-spacing: 0.03em;
  }

  .restart-row { text-align: center; margin-top: 32px; }
  .restart-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .restart-btn:hover { color: var(--gold); }

  .fade-in { animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .container { padding: 24px 20px 60px; }
    .header { margin-bottom: 32px; }
    .pillars-preview { grid-template-columns: 1fr; }
    .binary-options { flex-direction: column; }
    .impact-block, .cta-block { padding: 24px 20px; }
    .pillar-result-body, .pillar-result-head { padding-left: 20px; padding-right: 20px; }
    .intro-meta { gap: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="brand">Scanner <span>CORE</span></div>
    <div class="brand-tag" id="phase-tag">Inicio</div>
  </header>
  <main id="app"></main>
</div>

<script>
// ============================================
// CONFIG
// ============================================
const WHATSAPP_URL = "https://api.whatsapp.com/message/ACCBSIABCBTXA1?autoload=1&app_absent=0";

// ============================================
// STRUCTURE
// Each binary item: layer1 (¿lo tienes/haces?) + layer2 (¿con método/consciencia?)
// Scoring: both yes = solid (2), only layer1 = partial (1), layer1 no = missing (0)
// ============================================
const PILLARS = {
  AUTO: { name: 'Autoconciencia', num: '01', desc: 'Lo que sabes de ti cuando comunicas.' },
  EST:  { name: 'Estructura', num: '02', desc: 'Cómo conviertes una idea en mensaje.' },
  INF:  { name: 'Influencia', num: '03', desc: 'Cómo mueves a otros con tu presencia.' }
};

const ITEMS = [
  // AUTOCONCIENCIA (4)
  {
    pillar: 'AUTO',
    label: 'Emociones en escenario',
    l1: { text: '¿Sabes qué emoción te domina cuando estás frente a tu público?', context: 'No la que te gustaría sentir. La que realmente aparece — nervio, urgencia, euforia, bloqueo — cuando todas las miradas están en ti.',
      yes: 'Sí, la tengo identificada', no: 'No, nunca me he detenido a verlo' },
    l2: { text: '¿La reconoces en el momento, mientras estás hablando?', context: 'Saber cuál es tu emoción en frío es una cosa. Notarla en vivo, en pleno escenario, y manejarla a tu favor en lugar de que te maneje a ti, es otra.',
      yes: 'Sí, la noto y la manejo', no: 'No, me doy cuenta hasta después' }
  },
  {
    pillar: 'AUTO',
    label: 'Canal dominante',
    l1: { text: '¿Sabes cuál es tu canal de comunicación dominante?', context: 'Visual, auditivo o kinestésico. La forma en que tu mente procesa y transmite antes de que pienses en ello.',
      yes: 'Sí, sé cuál es', no: 'No, no lo tengo claro' },
    l2: { text: '¿Adaptas tu mensaje al canal de quien te escucha?', context: 'Comunicar desde tu propio canal es lo cómodo. Traducir al canal del otro — que el visual vea, que el auditivo escuche, que el kinestésico sienta — es lo que hace que te entiendan de verdad.',
      yes: 'Sí, lo adapto a mi público', no: 'No, comunico solo desde el mío' }
  },
  {
    pillar: 'AUTO',
    label: 'Formato dominante',
    l1: { text: '¿Tienes claro en qué formato comunicas mejor?', context: 'Uno a uno, escenario, cámara, panel, escrito. Cada quien tiene un terreno donde brilla y otros donde se apaga.',
      yes: 'Sí, sé cuál es mi terreno', no: 'No lo tengo identificado' },
    l2: { text: '¿Sabes qué te frena en los formatos que no dominas?', context: 'Saber que eres bueno en la cercanía del uno a uno no es lo mismo que saber exactamente qué se te traba frente a una cámara o en un escenario grande.',
      yes: 'Sí, sé qué me falta', no: 'No, solo sé que me cuesta' }
  },
  {
    pillar: 'AUTO',
    label: 'Temores',
    l1: { text: '¿Tienes identificados tus temores reales al comunicar?', context: 'Al ridículo, al silencio, a la pregunta que no sabes responder, a que te descubran. El que sea tuyo.',
      yes: 'Sí, sé cuáles son', no: 'No, no los he nombrado' },
    l2: { text: '¿Trabajas sobre ellos de forma deliberada?', context: 'Evitar el escenario que te da miedo no es manejarlo — es dejar que el miedo decida por ti. Trabajarlos es enfrentarlos con método, no solo esquivarlos.',
      yes: 'Sí, los trabajo a propósito', no: 'No, solo los evito' }
  },
  // ESTRUCTURA (3)
  {
    pillar: 'EST',
    label: 'Proceso creativo',

const STEPS = [];
STEPS.push({ type: 'name' });
STEPS.push({ type: 'open', key: 'context' });
STEPS.push({ type: 'section', pillar: 'AUTO' });
ITEMS.filter(i => i.pillar === 'AUTO').forEach((it, idx) => STEPS.push({ type: 'binary', item: it, globalIdx: ITEMS.indexOf(it) }));
STEPS.push({ type: 'section', pillar: 'EST' });
ITEMS.filter(i => i.pillar === 'EST').forEach((it, idx) => STEPS.push({ type: 'binary', item: it, globalIdx: ITEMS.indexOf(it) }));
STEPS.push({ type: 'open', key: 'struggle' });
STEPS.push({ type: 'section', pillar: 'INF' });
ITEMS.filter(i => i.pillar === 'INF').forEach((it, idx) => STEPS.push({ type: 'binary', item: it, globalIdx: ITEMS.indexOf(it) }));
STEPS.push({ type: 'impact' });
STEPS.push({ type: 'open', key: 'tried' });

// ============================================
// STATE
// ============================================
let state = {
  phase: 'intro',
  stepIdx: 0,
  binaryLayer: 1,
  userName: '',
  answers: {},      // globalIdx -> { l1: bool, l2: bool|null }
  impact: {},       // idx -> bool
  open: {},         // key -> string
  pdfDone: false
};

const totalBinarySteps = ITEMS.length;

function render() {
  const app = document.getElementById('app');
  const tag = document.getElementById('phase-tag');

  if (state.phase === 'intro') {
    tag.textContent = 'Inicio';
    app.innerHTML = renderIntro();
    document.getElementById('start').onclick = () => {
      state.phase = 'flow';
      state.stepIdx = 0;
      render();
    };
    return;
  }

  if (state.phase === 'flow') {
    const step = STEPS[state.stepIdx];
    if (step.type === 'name') { renderNameStep(step); }
    else if (step.type === 'open') { renderOpenStep(step); }
    else if (step.type === 'section') { renderSectionStep(step); }
    else if (step.type === 'binary') { renderBinaryStep(step); }
    else if (step.type === 'impact') { renderImpactStep(step); }
    return;
  }

  if (state.phase === 'results') {
    tag.textContent = 'Resultado';
    app.innerHTML = renderResults();
    wireResults();
  }
}

function setLayer1(step, val) {
  if (!state.answers[step.globalIdx]) state.answers[step.globalIdx] = { l1: null, l2: null };
  state.answers[step.globalIdx].l1 = val;

  if (val === false) {
    // No layer 2 — if you don't have it, mastering it is moot. Advance after a short beat.
    state.answers[step.globalIdx].l2 = false;
    advance();
  } else {
    // Reset l2 (in case they had answered no before and switched) and unfold layer 2
    state.answers[step.globalIdx].l2 = null;
    render();
  }
}

function setLayer2(step, val) {
  state.answers[step.globalIdx].l2 = val;
  advance();
}

function advance() {
  state.stepIdx++;
  if (state.stepIdx >= STEPS.length) {
    state.phase = 'results';
  }
  render();
}

function goBack() {
  if (state.stepIdx > 0) {
    state.stepIdx--;
    render();
  }
}

function countBinaryDone() {
  let c = 0;
  ITEMS.forEach((it, idx) => {
    const a = state.answers[idx];
    if (a && a.l1 !== null && (a.l1 === false || a.l2 !== null)) c++;
  });
  return c;
}

function computeScores() {
  const result = {};
  ['AUTO', 'EST', 'INF'].forEach(pk => {
    const items = ITEMS.map((it, idx) => ({ it, idx })).filter(x => x.it.pillar === pk);
    let score = 0;
    const maxPer = 2;
    const lines = items.map(({ it, idx }) => {
      const a = state.answers[idx] || { l1: false, l2: false };
      let status, pts;
      if (a.l1 && a.l2) { status = 'solid'; pts = 2; }
      else if (a.l1 && !a.l2) { status = 'partial'; pts = 1; }
      else { status = 'missing'; pts = 0; }
      score += pts;
      return { label: it.label, status };
    });
    const max = items.length * maxPer;
    result[pk] = { score, max, pct: Math.round((score / max) * 100), lines };
  });
  return result;
}

    return {
      headline: 'Sabes cosas valiosas que no están llegando.',
      text: 'Las tres respuestas apuntan al mismo lugar: hay una distancia entre lo que tienes dentro y lo que tu público recibe. No es que no tengas nada que decir — es que el mensaje se está perdiendo en el camino entre tu cabeza y su comprensión. Esa distancia tiene nombre, tiene causa y tiene solución. Y casi nunca está donde uno cree.'
    };
  } else {
    return {
      headline: 'Hay una grieta entre lo que haces y lo que consigues.',
      text: 'Algunas cosas te funcionan y otras no, y probablemente no tienes claro por qué. Esa inconsistencia es la señal más honesta de todo este scanner: significa que tu comunicación depende de factores que aún no controlas del todo. La buena noticia es que eso es entrenable. Lo que hoy es intermitente puede volverse consistente cuando sabes qué palanca mover.'
    };
  }
}

function globalNarrative(scores) {
  const entries = [['AUTO', scores.AUTO.pct], ['EST', scores.EST.pct], ['INF', scores.INF.pct]];
  entries.sort((a, b) => a[1] - b[1]);
  const weakest = PILLARS[entries[0][0]].name;
  const strongest = PILLARS[entries[2][0]].name;
  return `Tu pilar más firme es ${strongest} y donde más terreno tienes por ganar es ${weakest}. Pero el dato importante no es el número — es que ninguno de los tres funciona solo. Autoconciencia sin estructura es introspección que no comunica. Estructura sin influencia es un buen documento que nadie recuerda. Influencia sin autoconciencia es técnica que no se sostiene. Tu impacto real vive en cómo se sostienen los tres juntos.`;
}

function renderResults() {
  const scores = computeScores();
  const impact = impactVerdict();

  const pillarsHtml = ['AUTO', 'EST', 'INF'].map(pk => {
    const s = scores[pk];
    const p = PILLARS[pk];
    const linesHtml = s.lines.map(l => {
      const statusText = l.status === 'solid' ? 'Sólido' : l.status === 'partial' ? 'A medias' : 'Ausente';
      return `
        <div class="gap-line">
          <span class="gap-status ${l.status}">${statusText}</span>
          <span class="gap-label">${l.label}</span>
        </div>
      `;
    }).join('');
    return `
      <div class="pillar-result">
        <div class="pillar-result-head">
          <div class="pillar-result-top">
            <span class="pillar-result-name">${p.name}</span>
            <span class="pillar-result-pct">${s.score}/${s.max} · ${s.pct}%</span>
          </div>
          <div class="gap-track"><div class="gap-fill" style="width: ${s.pct}%"></div></div>
        </div>
        <div class="pillar-result-body">
          <p class="pillar-verdict">${pillarVerdict(pk, s.pct)}</p>
          <div class="gap-items">${linesHtml}</div>
        </div>
      </div>
    `;
  }).join('');

  const firstName = state.userName ? state.userName.split(' ')[0] : '';
  const titleName = firstName ? `, ${firstName}` : '';

  return `
    <section class="fade-in">
      <div class="results-eyebrow">Scanner CORE — El diagnóstico de ${state.userName || 'tu comunicación'}</div>
      <h1 class="results-title">Esto es lo que <em>realmente</em> pasa cuando comunicas${titleName}.</h1>
      <p class="results-intro-text">${globalNarrative(scores)}</p>

      ${pillarsHtml}

      <div class="impact-block">
        <div class="impact-label">El resultado real</div>
        <div class="impact-headline">${impact.headline}</div>
        <p class="impact-text">${impact.text}</p>
      </div>

      <div class="cta-block">
        <div class="cta-headline">Guarda tu diagnóstico y <em>léelo conmigo.</em></div>
        <p class="cta-sub">Descarga tu scanner completo en PDF. Después, lleva ese diagnóstico a una sesión de lectura personal donde vemos juntos qué significan tus resultados y qué camino tiene sentido para ti — sin costo.</p>
        <div class="cta-buttons">
          <button class="cta-btn pdf" id="pdf-btn">↓ Descargar mi diagnóstico (PDF)</button>
          <a class="cta-btn wa" id="wa-btn" href="${WHATSAPP_URL}" target="_blank" rel="noopener">Agendar mi sesión de lectura →</a>
        </div>
        <div class="cta-note" id="cta-note">Primero descarga tu PDF, luego agenda tu sesión.</div>
      </div>

      <div class="restart-row">
        <button class="restart-btn" id="restart">Reiniciar scanner</button>
      </div>
    </section>
  `;
}

function wireResults() {
  document.getElementById('pdf-btn').onclick = generatePDF;
  document.getElementById('restart').onclick = () => {
    state = { phase: 'intro', stepIdx: 0, binaryLayer: 1, userName: '', answers: {}, impact: {}, open: {}, pdfDone: false };
    render();
  };
  // animate gap fills
  requestAnimationFrame(() => {
    document.querySelectorAll('.gap-fill').forEach(el => {
      const w = el.style.width;
      el.style.width = '0';
      requestAnimationFrame(() => { el.style.width = w; });
    });
  });
}

// ============================================
// PDF GENERATION
// ============================================
function generatePDF() {
  const scores = computeScores();
  const impact = impactVerdict();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });

  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 48;
  let y = 0;

  // colors
  const gold = [245, 197, 24];
  const dark = [26, 23, 19];
  const muted = [110, 105, 96];
  const black = [20, 18, 16];

  function checkPage(needed) {
    if (y + needed > H - M) { doc.addPage(); y = M; }
  }

  // HEADER BAND
  doc.setFillColor(...dark);
  doc.rect(0, 0, W, 90, 'F');
  doc.setFillColor(...gold);
  doc.rect(0, 90, W, 3, 'F');
  doc.setTextColor(245, 241, 232);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.text('Scanner CORE', M, 46);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(...gold);
  doc.text('Diagnóstico de Comunicación e Influencia', M, 66);
  y = 125;

  // NAME + DATE LINE
  if (state.userName) {
    doc.setTextColor(...black);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text(state.userName, M, y);
    y += 20;
  }
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  const dateStr = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  doc.setTextColor(...muted);
  doc.text('Generado el ' + dateStr, M, y);
  y += 28;

  // CONTEXT (open answer)
  if (state.open.context) {
    doc.setTextColor(...gold);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('CONTEXTO', M, y);
    y += 16;
    doc.setTextColor(...black);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    const ctxLines = doc.splitTextToSize(state.open.context, W - M * 2);
    doc.text(ctxLines, M, y);
    y += ctxLines.length * 14 + 20;
  }

  // PILLARS
  ['AUTO', 'EST', 'INF'].forEach(pk => {
    const s = scores[pk];
    const p = PILLARS[pk];
    checkPage(140);

    doc.setDrawColor(...gold);
    doc.setLineWidth(2);
    doc.line(M, y, M + 24, y);
    y += 18;

    doc.setTextColor(...black);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    doc.text(p.name, M, y);
    doc.setTextColor(...gold);
    doc.setFontSize(12);
    doc.text(`${s.score}/${s.max} · ${s.pct}%`, W - M, y, { align: 'right' });
    y += 10;

    // bar
    doc.setFillColor(230, 226, 218);
    doc.rect(M, y, W - M * 2, 6, 'F');
    doc.setFillColor(...gold);
    doc.rect(M, y, (W - M * 2) * (s.pct / 100), 6, 'F');
    y += 22;

    // verdict
    doc.setTextColor(60, 56, 50);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    const vLines = doc.splitTextToSize(pillarVerdict(pk, s.pct), W - M * 2);
    doc.text(vLines, M, y);
    y += vLines.length * 12 + 12;

    // gap lines
    s.lines.forEach(l => {
      checkPage(20);
      const statusText = l.status === 'solid' ? 'SOLIDO' : l.status === 'partial' ? 'A MEDIAS' : 'AUSENTE';
      const col = l.status === 'solid' ? gold : l.status === 'partial' ? [196, 85, 61] : muted;
      doc.setFillColor(...col);
      doc.rect(M, y - 8, 4, 11, 'F');
      doc.setTextColor(...col);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(statusText, M + 10, y);
      doc.setTextColor(...black);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.text(l.label, M + 68, y);
      y += 18;
    });
    y += 16;
  });

  // IMPACT
  checkPage(120);
  doc.setFillColor(...dark);
  doc.rect(M, y, W - M * 2, 4, 'F');
  y += 22;
  doc.setTextColor(...gold);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9);
  doc.text('EL RESULTADO REAL', M, y);
  y += 18;
  doc.setTextColor(...black);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  const hLines = doc.splitTextToSize(impact.headline, W - M * 2);
  doc.text(hLines, M, y);
  y += hLines.length * 15 + 8;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  doc.setTextColor(60, 56, 50);
  const iLines = doc.splitTextToSize(impact.text, W - M * 2);
  doc.text(iLines, M, y);
  y += iLines.length * 12 + 24;

  // OPEN REFLECTIONS
  const reflections = [
    { key: 'struggle', label: 'CON QUÉ BATALLO' },
    { key: 'tried', label: 'QUÉ HE INTENTADO ANTES' }
  ];
  reflections.forEach(r => {
    if (state.open[r.key]) {
      checkPage(60);
      doc.setTextColor(...gold);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.text(r.label, M, y);
      y += 15;
      doc.setTextColor(...black);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(10);
      const rLines = doc.splitTextToSize('"' + state.open[r.key] + '"', W - M * 2);
      doc.text(rLines, M, y);
      y += rLines.length * 13 + 18;
    }
  });

  // FOOTER CTA
  checkPage(80);
  doc.setFillColor(...dark);
  doc.rect(M, y, W - M * 2, 60, 'F');
  doc.setFillColor(...gold);
  doc.rect(M, y, 3, 60, 'F');
  doc.setTextColor(245, 241, 232);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('Lleva este diagnóstico a tu sesión de lectura personal.', M + 18, y + 26);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(...gold);
  doc.text('Método CORE · Orlando Muñoz', M + 18, y + 44);

  const safeName = state.userName ? state.userName.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g, '').replace(/\s+/g, '-') : '';
  doc.save(safeName ? `Scanner-CORE-${safeName}.pdf` : 'Scanner-CORE-Diagnostico.pdf');

  // update UI state
  state.pdfDone = true;
  const pdfBtn = document.getElementById('pdf-btn');
  const waBtn = document.getElementById('wa-btn');
  const note = document.getElementById('cta-note');
  if (pdfBtn) { pdfBtn.classList.add('done'); pdfBtn.innerHTML = '✓ Diagnóstico descargado'; }
  if (waBtn) { waBtn.classList.add('highlight'); }
  if (note) { note.textContent = 'Listo. Ahora agenda tu sesión para leerlo juntos →'; }
}

render();
</script>
</body>
</html>
