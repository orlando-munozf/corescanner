<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner CORE — Diagnóstico de Comunicación, Influencia y Liderazgo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #0A0908;
    --bg-soft: #131110;
    --bg-card: #1A1713;
    --text: #F5F1E8;
    --text-muted: #8B837A;
    --text-dim: #5C554C;
    --border: #2A2620;
    --border-strong: #3D372D;
    --gold: #F5C518;
    --gold-bright: #FFD84D;
    --gold-deep: #C99A0A;
    --gold-glow: rgba(245, 197, 24, 0.15);
    --red-soft: #C4553D;
    --green-soft: #6FA85C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(ellipse at 50% 0%, var(--gold-glow) 0%, transparent 55%),
      radial-gradient(circle at 15% 90%, rgba(245, 197, 24, 0.04) 0%, transparent 40%);
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
  }
  .brand-logo { height: 22px; width: auto; display: block; }
  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  h1, h2, h3 { font-weight: 400; }

  /* INTRO / BRANCH SELECT */
  .intro h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(36px, 6.5vw, 60px);
    line-height: 1.03;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }
  .intro h1 em {
    font-style: italic;
    font-weight: 300;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--gold-deep));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .intro .lede {
    font-size: 17px;
    color: var(--text-muted);
    max-width: 560px;
    margin-bottom: 48px;
    line-height: 1.6;
  }
  .branch-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .branch-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .branch-card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 32px 28px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 260px;
  }
  .branch-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
  }
  .branch-card:hover { border-color: var(--gold); transform: translateY(-3px); background: var(--bg-card); }
  .branch-card:hover::before { transform: scaleX(1); }
  .branch-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.14em;
    margin-bottom: 20px;
  }
  .branch-name {
    font-family: 'Fraunces', serif;
    font-size: 27px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .branch-desc {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.55;
    flex-grow: 1;
  }
  .branch-for {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    line-height: 1.4;
  }
  .branch-for strong { color: var(--gold); font-weight: 500; }
  .branch-go {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* SHARED BUTTONS */
  .start-btn {
    background: var(--gold); color: var(--bg); border: none;
    padding: 18px 32px; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.02em; transition: all 0.2s ease;
    display: inline-flex; align-items: center; gap: 12px;
  }
  .start-btn:hover { transform: translateX(2px); box-shadow: 0 0 30px 0 var(--gold-glow); background: var(--gold-bright); }
  .start-btn .arrow { transition: transform 0.2s ease; }
  .start-btn:hover .arrow { transform: translateX(4px); }
  .continue-btn {
    background: var(--gold); color: var(--bg); border: none;
    padding: 14px 28px; font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.02em; transition: all 0.2s ease;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .continue-btn:hover { background: var(--gold-bright); transform: translateX(2px); }
  .back-btn {
    background: transparent; border: none; color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
    padding: 8px 0; transition: color 0.2s ease;
  }
  .back-btn:hover { color: var(--gold); }
  .back-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .intro-meta {
    margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);
    display: flex; gap: 32px; font-size: 13px; color: var(--text-dim); flex-wrap: wrap;
  }
  .intro-meta strong { color: var(--gold); font-weight: 600; }

  /* PROGRESS */
  .progress-wrap { margin-bottom: 48px; }
  .progress-info {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px;
  }
  .pillar-badge { color: var(--gold); }
  .progress-bar { height: 1px; background: var(--border); position: relative; overflow: hidden; }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold), var(--gold-bright));
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* NAME + OPEN */
  .open-block { max-width: 620px; }
  .open-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold);
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px;
  }
  .open-question {
    font-family: 'Fraunces', serif; font-size: clamp(26px, 4vw, 34px);
    line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 16px;
  }
  .open-hint { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }
  .open-input {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    padding: 20px; font-family: inherit; font-size: 16px; line-height: 1.6;
    resize: vertical; min-height: 140px; transition: border-color 0.2s ease;
  }
  .open-input:focus { outline: none; border-color: var(--gold); }
  .open-input::placeholder { color: var(--text-dim); }

  /* SCENARIO / BINARY */
  .q-text {
    font-family: 'Fraunces', serif; font-size: clamp(24px, 3.8vw, 32px);
    line-height: 1.25; letter-spacing: -0.02em; margin-bottom: 12px; max-width: 620px;
  }
  .q-context { font-size: 15px; color: var(--text-muted); margin-bottom: 40px; max-width: 560px; line-height: 1.55; }
  .binary-options { display: flex; gap: 12px; }
  .binary-btn {
    flex: 1; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    padding: 24px 22px; font-family: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease; text-align: center; line-height: 1.35;
  }
  .binary-btn:hover { border-color: var(--gold); background: var(--bg-card); transform: translateY(-2px); }
  .binary-btn.selected { border-color: var(--gold); background: var(--gold-glow); color: var(--gold); }

  .state-tag {
    display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 12px; margin-bottom: 22px;
  }
  .state-tag.natural { color: var(--green-soft); border: 1px solid rgba(111, 168, 92, 0.3); }
  .state-tag.pressure { color: var(--red-soft); border: 1px solid rgba(196, 85, 61, 0.3); }

  /* LAYER 2 */
  .layer2-block { margin-top: 32px; padding-top: 4px; }
  .layer2-connector { width: 1px; height: 28px; background: linear-gradient(180deg, var(--gold), transparent); margin: 0 auto 20px; }
  .layer2-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold); text-align: center; margin-bottom: 20px;
  }
  .q-subtext {
    font-family: 'Fraunces', serif; font-size: clamp(20px, 3.2vw, 26px);
    line-height: 1.3; letter-spacing: -0.02em; margin-bottom: 12px; max-width: 620px;
  }

  .nav-row { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; }

  /* SECTION INTRO */
  .section-intro { max-width: 600px; padding: 32px 0; }
  .section-intro .sec-num {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--gold);
    letter-spacing: 0.15em; margin-bottom: 20px;
  }
  .section-intro h2 {
    font-family: 'Fraunces', serif; font-size: clamp(30px, 5vw, 42px);
    line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 20px;
  }
  .section-intro h2 em { font-style: italic; color: var(--gold); font-weight: 300; }
  .section-intro p { font-size: 16px; color: var(--text-muted); line-height: 1.65; }

  /* RESULTS shared */
  .results-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold);
    letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 16px;
  }
  .results-title {
    font-family: 'Fraunces', serif; font-size: clamp(30px, 5vw, 46px);
    line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 16px;
  }
  .results-title em {
    font-style: italic; font-weight: 300;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .results-intro-text { font-size: 16px; color: var(--text-muted); line-height: 1.65; margin-bottom: 48px; max-width: 580px; }

  /* PILLAR RESULT (base branch) */
  .pillar-result { border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
  .pillar-result-head { padding: 24px 28px 20px; border-bottom: 1px solid var(--border); }
  .pillar-result-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .pillar-result-name { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
  .pillar-result-pct { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--gold); }
  .gap-track { height: 8px; background: var(--border); position: relative; overflow: hidden; }
  .gap-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width 1s cubic-bezier(0.2,0.8,0.2,1); }
  .pillar-result-body { padding: 20px 28px 24px; }
  .pillar-verdict { font-size: 15px; line-height: 1.6; color: var(--text); margin-bottom: 20px; }
  .gap-items { display: flex; flex-direction: column; gap: 10px; }
  .gap-line { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; line-height: 1.5; }
  .gap-status { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; flex-shrink: 0; margin-top: 1px; }
  .gap-status.solid { background: var(--gold-glow); color: var(--gold); }
  .gap-status.partial { background: rgba(196, 85, 61, 0.15); color: var(--red-soft); }
  .gap-status.missing { background: rgba(140, 131, 122, 0.12); color: var(--text-muted); }
  .gap-label { color: var(--text-muted); }

  /* IMPACT (base branch) */
  .impact-block {
    border: 1px solid var(--gold-deep);
    background: linear-gradient(135deg, var(--bg-soft), var(--bg-card));
    padding: 32px; margin: 40px 0; position: relative; overflow: hidden;
  }
  .impact-block::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .impact-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
  .impact-headline { font-family: 'Fraunces', serif; font-size: 24px; line-height: 1.3; margin-bottom: 20px; }
  .impact-text { font-size: 15px; color: var(--text-muted); line-height: 1.65; }

  /* LEADING RESULT — competency with dual state */
  .comp-result { border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
  .comp-head { padding: 24px 28px 22px; border-bottom: 1px solid var(--border); }
  .comp-name { font-family: 'Fraunces', serif; font-size: 25px; font-weight: 500; letter-spacing: -0.01em; margin-bottom: 20px; }
  .dual-bars { display: flex; flex-direction: column; gap: 14px; }
  .dual-row { }
  .dual-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .dual-state-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .dual-state-label.natural { color: var(--green-soft); }
  .dual-state-label.pressure { color: var(--red-soft); }
  .dual-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
  .dual-track { height: 7px; background: var(--border); position: relative; overflow: hidden; }
  .dual-fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width 1s cubic-bezier(0.2,0.8,0.2,1); }
  .dual-fill.natural { background: linear-gradient(90deg, rgba(111,168,92,0.6), var(--green-soft)); }
  .dual-fill.pressure { background: linear-gradient(90deg, rgba(196,85,61,0.6), var(--red-soft)); }
  .comp-body { padding: 20px 28px 24px; }
  .comp-gap-tag {
    display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; margin-bottom: 16px;
  }
  .comp-gap-tag.stable { background: var(--gold-glow); color: var(--gold); }
  .comp-gap-tag.cracks { background: rgba(196, 85, 61, 0.15); color: var(--red-soft); }
  .comp-gap-tag.collapse { background: rgba(196, 85, 61, 0.25); color: #E8896F; }
  .comp-verdict { font-size: 15px; line-height: 1.6; color: var(--text); }

  /* 4-ELEMENT REPORT BLOCKS */
  .report-section { margin: 40px 0; }
  .report-section-title {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .report-block { border: 1px solid var(--border); padding: 26px 28px; margin-bottom: 16px; }
  .report-block-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .report-block-title { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 14px; letter-spacing: -0.01em; }
  .report-block-text { font-size: 15px; color: var(--text-muted); line-height: 1.65; }
  .report-block-text strong { color: var(--text); font-weight: 500; }

  /* VERDICT */
  .verdict-block { border: 2px solid var(--gold-deep); padding: 36px 32px; margin: 40px 0; position: relative; overflow: hidden; background: linear-gradient(135deg, var(--bg-soft), var(--bg-card)); }
  .verdict-block::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--verdict-color, var(--gold)); }
  .verdict-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--verdict-color, var(--gold)); margin-bottom: 16px; }
  .verdict-headline { font-family: 'Fraunces', serif; font-size: clamp(26px, 4.5vw, 36px); line-height: 1.15; margin-bottom: 20px; letter-spacing: -0.02em; }
  .verdict-text { font-size: 16px; color: var(--text-muted); line-height: 1.65; }

  /* CTA */
  .cta-block { text-align: center; padding: 48px 32px; border: 1px solid var(--border); margin-top: 40px; background: var(--bg-soft); }
  .cta-headline { font-family: 'Fraunces', serif; font-size: clamp(24px, 4vw, 32px); line-height: 1.2; margin-bottom: 16px; }
  .cta-headline em { font-style: italic; color: var(--gold); }
  .cta-sub { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; max-width: 460px; margin-left: auto; margin-right: auto; }
  .cta-buttons { display: flex; flex-direction: column; gap: 12px; max-width: 380px; margin: 0 auto; }
  .cta-btn {
    padding: 18px 28px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    letter-spacing: 0.02em; transition: all 0.2s ease; border: none; display: inline-flex;
    align-items: center; justify-content: center; gap: 10px; text-decoration: none;
  }
  .cta-btn.pdf { background: var(--gold); color: var(--bg); }
  .cta-btn.pdf:hover { background: var(--gold-bright); box-shadow: 0 0 24px var(--gold-glow); }
  .cta-btn.pdf.done { background: var(--bg-card); color: var(--gold); border: 1px solid var(--gold); }
  .cta-btn.cal { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
  .cta-btn.cal:hover { border-color: var(--gold); color: var(--gold); }
  .cta-btn.cal.highlight { background: var(--gold); color: var(--bg); border-color: var(--gold); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--gold-glow); } 50% { box-shadow: 0 0 24px 2px var(--gold-glow); } }
  .cta-note { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 20px; letter-spacing: 0.03em; }

  .restart-row { text-align: center; margin-top: 32px; }
  .restart-btn { background: transparent; border: none; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: color 0.2s ease; }
  .restart-btn:hover { color: var(--gold); }

  .fade-in { animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 640px) {
    .container { padding: 24px 20px 60px; }
    .header { margin-bottom: 32px; }
    .branch-cards { grid-template-columns: 1fr; }
    .branch-card { min-height: auto; }
    .binary-options { flex-direction: column; }
    .impact-block, .cta-block, .verdict-block { padding: 24px 20px; }
    .pillar-result-body, .pillar-result-head, .comp-head, .comp-body, .report-block { padding-left: 20px; padding-right: 20px; }
    .intro-meta { gap: 16px; }
  }
</style>
</head>
<body>

  if (branch === 'base') {
    steps.push({ type: 'open', key: 'context', set: 'base' });
    steps.push({ type: 'section', pillar: 'AUTO' });
    BASE_ITEMS.forEach((it, i) => { if (it.pillar === 'AUTO') steps.push({ type: 'binary', gi: i }); });
    steps.push({ type: 'section', pillar: 'EST' });
    BASE_ITEMS.forEach((it, i) => { if (it.pillar === 'EST') steps.push({ type: 'binary', gi: i }); });
    steps.push({ type: 'open', key: 'struggle', set: 'base' });
    steps.push({ type: 'section', pillar: 'INF' });
    BASE_ITEMS.forEach((it, i) => { if (it.pillar === 'INF') steps.push({ type: 'binary', gi: i }); });
    steps.push({ type: 'impact' });
    steps.push({ type: 'open', key: 'tried', set: 'base' });
  } else {
    steps.push({ type: 'open', key: 'context', set: 'lead' });
    // order competencies; within each, natural then pressure
    const order = ['COM', 'EMO', 'DEC', 'AUT', 'ADA'];
    let insertedChallenge = false;
    order.forEach((ck, ci) => {
      steps.push({ type: 'lead-section', comp: ck });
      LEAD_ITEMS.forEach((it, i) => { if (it.comp === ck) steps.push({ type: 'lead-binary', gi: i }); });
      // drop the mid open question after the 2nd competency (EMO)
      if (ck === 'EMO' && !insertedChallenge) {
        steps.push({ type: 'open', key: 'challenge', set: 'lead' });
        insertedChallenge = true;
      }
    });
    steps.push({ type: 'open', key: 'tried', set: 'lead' });
  }
  return steps;
}

// ============================================================
// RENDER ROUTER
// ============================================================
function render() {
  const app = document.getElementById('app');
  const tag = document.getElementById('phase-tag');

  if (state.phase === 'intro') {
    tag.textContent = 'Inicio';
    app.innerHTML = renderIntro();
    document.getElementById('branch-base').onclick = () => startBranch('base');
    document.getElementById('branch-lead').onclick = () => startBranch('lead');
    return;
  }
  if (state.phase === 'flow') {
    const step = STEPS[state.stepIdx];
    if (step.type === 'name') renderNameStep();
    else if (step.type === 'open') renderOpenStep(step);
    else if (step.type === 'section') renderSectionStep(step);
    else if (step.type === 'lead-section') renderLeadSectionStep(step);
    else if (step.type === 'binary') renderBinaryStep(step, false);
    else if (step.type === 'lead-binary') renderBinaryStep(step, true);
    else if (step.type === 'impact') renderImpactStep();
    return;
  }
  if (state.phase === 'results') {
    tag.textContent = 'Resultado';
    app.innerHTML = state.branch === 'base' ? renderBaseResults() : renderLeadResults();
    wireResults();
  }
}

function startBranch(branch) {
  state.branch = branch;
  STEPS = buildSteps(branch);
  state.phase = 'flow';
  state.stepIdx = 0;
  state.answers = {}; state.impact = {}; state.open = {};
  render();
}

// ============================================================
// NAV
// ============================================================
function advance() { state.stepIdx++; if (state.stepIdx >= STEPS.length) state.phase = 'results'; render(); }
function goBack() {
  if (state.stepIdx > 0) { state.stepIdx--; render(); }
  else { state.phase = 'intro'; state.branch = null; render(); }
}
function flowProgress() {
  // fraction of binary items answered across current branch
  const isLead = state.branch === 'lead';
  const items = isLead ? LEAD_ITEMS : BASE_ITEMS;
  let done = 0;
  items.forEach((it, i) => {
    const a = state.answers[keyOf(isLead, i)];
    if (a && a.l1 !== null && (a.l1 === false || a.l2 !== null)) done++;
  });
  return (done / items.length) * 100;
}

// ============================================================
// SCORING — BASE
// ============================================================
function baseScores() {
  const result = {};
  ['AUTO','EST','INF'].forEach(pk => {
    const idxs = []; BASE_ITEMS.forEach((it,i)=>{ if(it.pillar===pk) idxs.push(i); });
    let score = 0;
    const lines = idxs.map(i => {
      const a = state.answers['B'+i] || { l1:false, l2:false };
      let status, pts;
      if (a.l1 && a.l2) { status='solid'; pts=2; }
      else if (a.l1 && !a.l2) { status='partial'; pts=1; }
      else { status='missing'; pts=0; }
      score += pts;
      return { label: BASE_ITEMS[i].label, status };
    });
    const max = idxs.length*2;
    result[pk] = { score, max, pct: Math.round(score/max*100), lines };
  });
  return result;
}

// ============================================================
// SCORING — LEAD (dual state per competency)
// ============================================================
function leadScores() {
  const result = {};
  Object.keys(LEAD_COMPS).forEach(ck => {
    const natIdx = [], preIdx = [];
    LEAD_ITEMS.forEach((it,i)=>{ if(it.comp===ck){ (it.state==='nat'?natIdx:preIdx).push(i); } });
    const scoreState = (idxs) => {
      let s = 0;
      idxs.forEach(i => {
        const a = state.answers['L'+i] || { l1:false, l2:false };
        if (a.l1 && a.l2) s += 2; else if (a.l1 && !a.l2) s += 1;
      });
      return { score: s, max: idxs.length*2, pct: idxs.length ? Math.round(s/(idxs.length*2)*100) : 0 };
    };
    const nat = scoreState(natIdx);
    const pre = scoreState(preIdx);
    const gap = nat.pct - pre.pct; // positive = drops under pressure
    result[ck] = { nat, pre, gap, weight: LEAD_COMPS[ck].weight };
  });
  return result;
}

    },
    EST: {
      high: 'Sabes construir mensajes que se sostienen. No dependes de la inspiración, tienes método. Tu reto ahora es que la estructura no te vuelva rígido — que siga al servicio de la emoción, no al revés.',

function baseImpactVerdict() {
  const yeses = Object.values(state.impact).filter(v => v === true).length;
  if (yeses === 3) return { headline: 'Comunicas con impacto — ahora el reto es sistematizarlo.', text: 'Sientes que conectas, que te comprenden y que lo haces desde tu autenticidad. Eso te pone adelante de la mayoría. Pero "sentir" que funciona y "saber por qué" funciona son cosas distintas. Lo que hoy haces por instinto, si lo vuelves método, deja de depender de tu buen día y empieza a ser replicable — incluso enseñable.' };
  if (yeses === 0) return { headline: 'Sabes cosas valiosas que no están llegando.', text: 'Las tres respuestas apuntan al mismo lugar: hay una distancia entre lo que tienes dentro y lo que tu público recibe. No es que no tengas nada que decir — es que el mensaje se está perdiendo en el camino entre tu cabeza y su comprensión. Esa distancia tiene nombre, tiene causa y tiene solución.' };
  return { headline: 'Hay una grieta entre lo que haces y lo que consigues.', text: 'Algunas cosas te funcionan y otras no, y probablemente no tienes claro por qué. Esa inconsistencia es la señal más honesta de todo este scanner: significa que tu comunicación depende de factores que aún no controlas del todo. La buena noticia es que eso es entrenable.' };

function baseNarrative(scores) {
  const e = [['AUTO',scores.AUTO.pct],['EST',scores.EST.pct],['INF',scores.INF.pct]].sort((a,b)=>a[1]-b[1]);
  const weak = BASE_PILLARS[e[0][0]].name, strong = BASE_PILLARS[e[2][0]].name;
  return `Tu pilar más firme es ${strong} y donde más terreno tienes por ganar es ${weak}. Pero el dato importante no es el número — es que ninguno de los tres funciona solo. Autoconciencia sin estructura es introspección que no comunica. Estructura sin influencia es un buen documento que nadie recuerda. Influencia sin autoconciencia es técnica que no se sostiene. Tu impacto real vive en cómo se sostienen los tres juntos.`;
}

// RESULTS — LEAD branch (4-element report + verdict)
// ============================================================
function leadCompVerdict(ck, sc) {
  const name = LEAD_COMPS[ck].name;
  const gap = sc.gap;
  const natHigh = sc.nat.pct >= 67, natMid = sc.nat.pct >= 34;
  let gapClass, gapTag, gapLine;
  if (gap <= 15) { gapClass='stable'; gapTag='Estable bajo presión'; gapLine='Sostienes esta competencia aunque suba la temperatura — lo que haces en calma lo haces también cuando aprieta.'; }
  else if (gap <= 40) { gapClass='cracks'; gapTag='Se agrieta bajo presión'; gapLine='En calma funcionas, pero cuando hay presión pierdes terreno. Ese bache es justo donde el liderazgo se nota, porque los momentos que definen suelen ser los de presión.'; }
  else { gapClass='collapse'; gapTag='Se cae bajo presión'; gapLine='La diferencia entre tu versión tranquila y tu versión bajo presión es grande. Pareces sólido cuando todo fluye, pero te desarmas justo cuando más te necesitan firme. Ese es el patrón más caro en un líder.'; }
  const base = natHigh ? `Tienes buen dominio natural de ${name.toLowerCase()}.` : natMid ? `Tu ${name.toLowerCase()} en el día a día es intermedia.` : `${name} es de tus zonas más flojas, incluso en calma.`;
  return { gapClass, gapTag, text: `${base} ${gapLine}` };
}

function leadReport(scores) {
  // Weighted overall (comunicación pesa 2). Combine nat+pre per comp.
  let totalW = 0, gotW = 0;
  Object.keys(scores).forEach(ck => {
    const sc = scores[ck];
    const combined = (sc.nat.pct + sc.pre.pct) / 2;
    const w = sc.weight;
    totalW += w * 100; gotW += w * combined;
  });
  const overall = Math.round(gotW / totalW * 100);

  // Rank by combined
  const ranked = Object.keys(scores).map(ck => ({
    ck, combined: (scores[ck].nat.pct + scores[ck].pre.pct)/2, gap: scores[ck].gap
  })).sort((a,b)=>a.combined-b.combined);
  const weakest = ranked[0], strongest = ranked[ranked.length-1];
  const biggestGap = [...Object.keys(scores)].map(ck=>({ck,gap:scores[ck].gap})).sort((a,b)=>b.gap-a.gap)[0];

  // ELEMENT 1 — nivel actual
  const el1 = `En calma, tu perfil más firme es <strong>${LEAD_COMPS[strongest.ck].name}</strong> y el más flojo es <strong>${LEAD_COMPS[weakest.ck].name}</strong>. Pero el liderazgo real no se juega en calma. Por eso lo que más importa de este diagnóstico no es cada número solo, sino la distancia entre cómo lideras normalmente y cómo lideras cuando aprieta.`;

  // ELEMENT 2 — gap vs lo que el rol exige
  const gapComp = LEAD_COMPS[biggestGap.ck].name;
  let el2;
  if (biggestGap.gap <= 15) {
    el2 = `Tu mayor caída bajo presión está en <strong>${gapComp}</strong>, pero es moderada. En general sostienes tu nivel cuando sube la temperatura — eso ya te pone por encima del líder promedio, que se desarma justo cuando el equipo más lo observa. El rol te exige mantener esa consistencia conforme crezca la presión y el tamaño de lo que diriges.`;
  } else {
    el2 = `Donde más se abre el gap es en <strong>${gapComp}</strong>: la distancia entre tu versión tranquila y tu versión bajo presión es la señal más importante de este scanner. Un rol de liderazgo no te paga por cómo actúas en los días buenos — te paga por cómo respondes cuando hay conflicto, urgencia o algo en juego. Ahí es donde hoy tienes la brecha más cara entre lo que el puesto exige y lo que entregas.`;
  }

  // ELEMENT 3 — desarrollable + riesgos
  const criticalGaps = Object.keys(scores).filter(ck => scores[ck].gap > 40).length;
  const lowNaturals = Object.keys(scores).filter(ck => scores[ck].nat.pct < 34).length;
  let el3, verdict;
  if (overall >= 55 && criticalGaps <= 1) {
    el3 = `<strong>Sí, es claramente desarrollable.</strong> Tienes base natural en varias competencias, así que el trabajo no es construir de cero — es blindar lo que ya tienes para que aguante presión. Ese tipo de desarrollo es el más rápido y el de mejor retorno, porque partes de material sólido. <br><br>El riesgo principal en tu caso no es la capacidad, es la constancia: como ya funcionas bien en calma, es fácil creer que no necesitas trabajar los momentos de presión hasta que uno de esos momentos te cuesta caro.`;
    verdict = { color: 'var(--green-soft)', label: 'Veredicto de viabilidad', headline: 'Entrenable, con retorno alto.', text: 'Este perfil vale la pena desarrollar. Hay base sólida y los gaps son cerrables con trabajo enfocado en el desempeño bajo presión. Es el tipo de líder donde una intervención bien dirigida rinde resultados visibles rápido.' };
  } else if (overall >= 35 || (overall >= 30 && criticalGaps <= 2)) {
    el3 = `<strong>Sí es desarrollable, pero requiere trabajo real y sostenido.</strong> Hay competencias donde tu base natural es delgada y otras donde la presión te desarma. No es un caso de pulir — es de construir en algunas zonas y blindar en otras. <br><br>El riesgo a vigilar: ${lowNaturals >= 2 ? 'tienes varias competencias flojas incluso en calma, lo que significa que el desarrollo tiene que empezar por los cimientos antes de tocar el desempeño bajo presión. Saltarse ese orden es la causa más común de que el entrenamiento no pegue.' : 'los gaps bajo presión son marcados, así que el trabajo tiene que incluir práctica en condiciones reales de tensión, no solo teoría en un salón. Un desarrollo puramente conceptual aquí no va a mover la aguja donde importa.'}`;
    verdict = { color: 'var(--gold)', label: 'Veredicto de viabilidad', headline: 'Entrenable, con trabajo enfocado.', text: 'Este perfil se puede desarrollar, pero no con un curso genérico. Necesita un plan que ataque el orden correcto — cimientos primero, presión después — y práctica en condiciones reales. Con eso, el potencial está. Sin eso, el esfuerzo se diluye.' };
  } else {
    el3 = `<strong>Es desarrollable en teoría, pero con reservas honestas.</strong> El nivel natural es bajo en varias competencias y la presión desarma casi todo. Eso no significa que la persona no sirva — significa que el desarrollo sería largo, costoso, y con un retorno incierto que depende mucho de qué tan dispuesta esté a un trabajo profundo y sostenido. <br><br>El riesgo mayor es invertir tiempo y recursos esperando un cambio rápido que este perfil no va a dar. Si el rol necesita a alguien firme bajo presión pronto, el desarrollo quizá no llegue a tiempo.`;
    verdict = { color: 'var(--red-soft)', label: 'Veredicto de viabilidad', headline: 'Desarrollable, pero evalúa el costo-tiempo.', text: 'Antes de invertir en desarrollar este perfil, vale la pena una conversación honesta sobre expectativas y plazos. El cambio es posible pero lento, y si el rol exige solidez bajo presión en el corto plazo, quizá tenga más sentido combinar el desarrollo con apoyo externo — o revisar si esta es la persona para este asiento en este momento.' };
  }

  // ELEMENT 4 — qué de CORE ya domina
  const dominates = [];
  const needs = [];
  Object.keys(scores).forEach(ck => {
    const combined = (scores[ck].nat.pct + scores[ck].pre.pct)/2;
    if (combined >= 60) dominates.push(LEAD_COMPS[ck].name);
    else if (combined < 40) needs.push(LEAD_COMPS[ck].name);
  });
  let el4;
  if (dominates.length) {
    el4 = `Ya dominas <strong>${listWords(dominates)}</strong>. Eso significa que un buen desarrollo no debería gastar tiempo re-enseñándote esto — sería venderte teoría que no necesitas. `;
  } else {
    el4 = `No hay ninguna competencia que domines completa (natural y bajo presión), así que el desarrollo tiene margen amplio para trabajar. `;
  }
  if (needs.length) {
    el4 += `Donde el trabajo rinde más es en <strong>${listWords(needs)}</strong> — ahí está el terreno por ganar. Un programa que arranque por ahí, en vez de por lo genérico, es el que te movería la aguja.`;
  } else {
    el4 += `El resto son competencias intermedias: no partes de cero, pero tampoco están blindadas. El trabajo fino está en llevarlas de "funciona a veces" a "aguanta siempre".`;
  }

  return { overall, el1, el2, el3, el4, verdict };
}

function listWords(arr) {
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return arr[0] + ' y ' + arr[1];
  return arr.slice(0,-1).join(', ') + ' y ' + arr[arr.length-1];
}

  doc.setTextColor(...black); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  const vh=doc.splitTextToSize(rep.verdict.headline, W-M*2); doc.text(vh,M,y); y+=vh.length*15+8;
  doc.setTextColor(60,56,50); doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  const vt=doc.splitTextToSize(rep.verdict.text, W-M*2); doc.text(vt,M,y); y+=vt.length*12+22;

  [['challenge','MAYOR RETO LIDERANDO'],['tried','QUE HA INTENTADO']].forEach(([k,lab])=>{
    if (state.open[k]) { cp(60); doc.setTextColor(...gold); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text(lab,M,y); y+=15;
      doc.setTextColor(...black); doc.setFont('helvetica','italic'); doc.setFontSize(10);
      const rl=doc.splitTextToSize('"'+state.open[k]+'"', W-M*2); doc.text(rl,M,y); y+=rl.length*13+18; }
  });

  pdfFooter(doc, W, H, M, y);
  savePDF(doc);
  markPdfDone();
}

function pdfFooter(doc, W, H, M, y) {
  const dark=[26,23,19], gold=[245,197,24];
  if (y+70 > H-M) { doc.addPage(); y=M; }
  doc.setFillColor(...dark); doc.rect(M,y,W-M*2,60,'F');
  doc.setFillColor(...gold); doc.rect(M,y,3,60,'F');
  doc.setTextColor(245,241,232); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Lleva este diagnóstico a tu sesión de discovery.', M+18, y+26);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...gold);
  doc.text('Método CORE · Orlando Muñoz', M+18, y+44);
}

function savePDF(doc) {
  const safe = state.userName ? state.userName.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,'').replace(/\s+/g,'-') : '';
  const prefix = state.branch==='lead' ? 'CORE-Leading' : 'Scanner-CORE';
  doc.save(safe ? `${prefix}-${safe}.pdf` : `${prefix}-Diagnostico.pdf`);
}

function markPdfDone() {
  state.pdfDone = true;
  const p=document.getElementById('pdf-btn'), c=document.getElementById('cal-btn'), n=document.getElementById('cta-note');
  if (p) { p.classList.add('done'); p.innerHTML='✓ Diagnóstico descargado'; }
  if (c) c.classList.add('highlight');
  if (n) n.textContent='Listo. Ahora agenda tu sesión de discovery →';
}

render();

</script>
</body>
